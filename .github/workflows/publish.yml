name: CD

on:
  push:
    # Only exact versions. The moving v1 and v1.2 tags cannot be published: npm rejects `1` as a
    # version, and they point at a commit some vMAJOR.MINOR.PATCH tag already published.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # `release.sh` dispatches this workflow after moving a tag. A tag that is force-moved to a new
  # commit does not always emit a push event, so the dispatch is what makes a re-release publish.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (for example, v1.2.3)'
        required: true
        type: string
      docker_tags:
        description: 'Image tags to push, comma separated (for example, 1.2.3,1.2,1,latest)'
        required: false
        default: ''
        type: string

# `github.ref_name` is the tag for a push and the branch for a dispatch, so neither is usable on its
# own. Everything below reads this instead.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # The repository pins its runtime; 'latest' would test something nobody develops against.
          node-version-file: .nvmrc

      # `npm ci` installs exactly the lockfile. `npm install` would resolve the ranges afresh, which
      # is how a newer linter than anyone has locally ends up failing a build.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # `npm test` covers the packaged artefact through test/suites/package.test.ts, which packs a
      # tarball and installs it. This is the extra belt: the build output must exist and be complete.
      - name: Verify the build output
        run: |
          npm run build
          test -f dist/src/server/main.js
          test -f dist/src/server/main.d.ts
          test -f dist/bin/server.js
          node dist/bin/port.js --version

  publish-package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js for npm
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      # `npm publish` runs `prepack`, which builds. The compiler is a development dependency, so it
      # has to be installed for that to work.
      - name: Install dependencies
        run: npm ci

      - name: Set package version from tag
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A second registry needs its own `.npmrc`, which `setup-node` rewrites. Without this the
      # second publish would target npm again and fail with a 409.
      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: 'https://npm.pkg.github.com'
          scope: '@plushveil'

      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derived from the repository name, so a fork or a rename cannot publish to the wrong package.
      - name: Derive image tags
        id: tags
        env:
          # `release.sh` works out which moving aliases this release is allowed to claim, because
          # only it knows what other versions exist. A bare tag push gets the exact version alone.
          DOCKER_TAGS: ${{ inputs.docker_tags || '' }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${RELEASE_TAG#v}"

          IFS=',' read -ra ALIASES <<< "${DOCKER_TAGS:-$VERSION}"
          TAGS=()
          for ALIAS in "${ALIASES[@]}"; do
            TAGS+=("${IMAGE}:${ALIAS}")
          done

          IFS=','
          {
            echo "tags=${TAGS[*]}"
            echo "image=${IMAGE}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # QEMU above exists for this. Without an explicit list the build is amd64 only.
          platforms: linux/amd64,linux/arm64
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Publishing an image that cannot serve a request is worse than not publishing one, so the
      # pushed image is pulled back and exercised against the repository's own fixture.
      - name: Verify the pushed image serves a mounted folder
        run: |
          IMAGE="${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}"
          docker run -d --name verify -p 3000:3000 \
            -v "$PWD/test/fixtures/api-health/api:/api:ro" "$IMAGE"

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then break; fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/health | tee /dev/stderr | grep -q '"status":"ok"'
          docker rm -f verify
