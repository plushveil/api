name: Release

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Commit hash or branch name to release from'
        required: false
        default: ''
        type: string
      tag:
        description: 'Release tag (for example, v4.5.6)'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create release tags
        run: bash .github/scripts/release.sh
        env:
          SOURCE: ${{ inputs.source || github.event.repository.default_branch }}
          TAG: ${{ inputs.tag }}
          # `release.sh` dispatches publish.yml through `gh`, which reads this.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
